id: "chocolate_coconut_macaroon"
title: "Chocolate Dipped Coconut Macaroon"
category: "dessert" # Options: meal | baking | dessert
prep_time_min: 15
cook_time_min: 20
servings: 6
ingredients:
  - item: "sweetened condensed milk"
    amount_us: 1
    unit_us: "cup"
    amount_metric: 240
    unit_metric: "g"

  - item: "almond extract"
    amount_us: 0.25
    unit_us: "teaspoon"
    amount_metric: 1
    unit_metric: "g"

  - item: "vanilla extract"
    amount_us: 1.5
    unit_us: "teaspoons"
    amount_metric: 6
    unit_metric: "g"

  - item: "fine salt"
    amount_us: 0.25
    unit_us: "teaspoon"
    amount_metric: 1.5
    unit_metric: "g"

  - item: "egg white"
    amount_us: 1
    unit_us: "large"
    amount_metric: 30
    unit_metric: "g"

  - item: "shredded unsweetened coconut"
    amount_us: 3
    unit_us: "cups"
    amount_metric: 240
    unit_metric: "g"

  - item: "semisweet chocolate, chopped"
    amount_us: 4
    unit_us: "ounces"
    amount_metric: 113
    unit_metric: "g"
instructions:
- "Preheat the oven to 350 degrees F (175 degrees C)."
- "Combine condensed milk, almond extract, vanilla extract, salt, and egg white in a bowl. Whisk until thoroughly combined. Add about 2 1/3 cups shredded coconut. Mix with a spatula until mixture is sticky and holds together. Form into balls using a sorbet scoop."
- "Roll balls in remaining coconut. Space macaroons evenly onto a silicone-lined baking sheet."
- "Bake in the preheated oven until golden, about 20 minutes. Let cool to room temperature, at least 20 minutes."
- "Meanwhile, place 3/4 of the chocolate in top of a double boiler over simmering water. Stir frequently, scraping down the sides with a rubber spatula to avoid scorching, until chocolate is melted, about 5 minutes. Remove from heat and stir in the rest of the chocolate until it melts."
- "Dip the base of each cooled macaroon about 1/8 inch into the chocolate. Place cookies, chocolate-side down, on parchment paper. Let chocolate harden completely."