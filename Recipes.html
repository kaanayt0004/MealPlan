<!DOCTYPE html>
<html lang="en" x-data="recipeApp()" x-init="initApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recipes</title>
    <!-- Tailwind CSS with Class Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- js-yaml -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        [x-cloak] { display: none !important; }

        /* Strict White-Background Print/PDF Stylesheet */
        @media print {
            body, html {
                background: #ffffff !important;
                color: #000000 !important;
            }
            aside, main, .no-print {
                display: none !important;
            }
            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
                background: #ffffff !important;
                color: #000000 !important;
            }
            #print-area * {
                color: #000000 !important;
                background: transparent !important;
                border-color: #e5e7eb !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-[#F5F5F7] dark:bg-[#121212] text-gray-900 dark:text-gray-100 flex h-screen overflow-hidden select-none transition-colors duration-300">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white/80 dark:bg-[#1E1E1E]/80 backdrop-blur-xl border-r border-gray-200 dark:border-gray-800 flex flex-col p-6 z-10 shadow-sm justify-between">
        <div>
            <h1 class="text-xl font-bold mb-8 tracking-tight flex items-center justify-center space-x-2">
                <span>🍳</span><span>recipes</span>
            </h1>
            <nav class="space-y-2">
                <button @click="tab = 'recipes'" 
                        :class="tab === 'recipes' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 font-semibold' : 'hover:bg-gray-100 dark:hover:bg-gray-800/60 text-gray-600 dark:text-gray-400 font-medium'"
                        class="w-full flex items-center justify-center py-3 px-4 rounded-xl transition-all duration-200 text-center">
                    Recipes
                </button>
                <button @click="tab = 'planner'" 
                        :class="tab === 'planner' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 font-semibold' : 'hover:bg-gray-100 dark:hover:bg-gray-800/60 text-gray-600 dark:text-gray-400 font-medium'"
                        class="w-full flex items-center justify-center py-3 px-4 rounded-xl transition-all duration-200 text-center">
                    Meal Planner
                </button>
                <button @click="tab = 'cart'" 
                        :class="tab === 'cart' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 font-semibold' : 'hover:bg-gray-100 dark:hover:bg-gray-800/60 text-gray-600 dark:text-gray-400 font-medium'"
                        class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl transition-all duration-200 text-center">
                    <span>Shopping Cart</span>
                    <span class="bg-blue-500/20 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded-full text-xs font-bold" x-text="Object.keys(cart).length">0</span>
                </button>
                <button @click="tab = 'converter'" 
                        :class="tab === 'converter' ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20 font-semibold' : 'hover:bg-gray-100 dark:hover:bg-gray-800/60 text-gray-600 dark:text-gray-400 font-medium'"
                        class="w-full flex items-center justify-center py-3 px-4 rounded-xl transition-all duration-200 text-center">
                    Unit Converter
                </button>
            </nav>
        </div>

        <!-- Dark / Light Theme Toggle -->
        <button @click="toggleDarkMode()" 
                class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all text-sm font-medium">
            <span x-text="darkMode ? '☀️ Light Mode' : '🌙 Dark Mode'"></span>
        </button>
    </aside>

    <!-- Main Content Canvas -->
    <main class="flex-1 overflow-y-auto p-10 relative">
        <div class="max-w-4xl mx-auto">

            <!-- TAB 1: RECIPES -->
            <div x-show="tab === 'recipes'" class="space-y-6">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-2">
                    <h2 class="text-3xl font-bold tracking-tight">Recipe Library</h2>
                    <div class="flex items-center space-x-3">
                        <select x-model="sortBy" class="p-2.5 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#1C1C1E] text-xs font-semibold">
                            <option value="default">Sort: Default</option>
                            <option value="alpha">Sort: A–Z</option>
                        </select>
                        <label class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2.5 rounded-xl cursor-pointer shadow-md transition-all hover:scale-105 active:scale-95 flex items-center space-x-1.5 text-xs">
                            <span>+ Import Recipe</span>
                            <input type="file" accept=".yaml,.yml,.json" class="hidden" @change="importRecipe($event)">
                        </label>
                    </div>
                </div>

                <!-- Category Filter Pills -->
                <div class="flex space-x-2">
                    <button @click="filterCategory = 'all'" :class="filterCategory === 'all' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-[#1C1C1E] text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-800'" class="px-4 py-1.5 rounded-xl text-xs font-bold transition-all">All</button>
                    <button @click="filterCategory = 'meal'" :class="filterCategory === 'meal' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-[#1C1C1E] text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-800'" class="px-4 py-1.5 rounded-xl text-xs font-bold transition-all">Meals</button>
                    <button @click="filterCategory = 'baking'" :class="filterCategory === 'baking' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-[#1C1C1E] text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-800'" class="px-4 py-1.5 rounded-xl text-xs font-bold transition-all">Baking</button>
                    <button @click="filterCategory = 'dessert'" :class="filterCategory === 'dessert' ? 'bg-blue-600 text-white' : 'bg-white dark:bg-[#1C1C1E] text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-gray-800'" class="px-4 py-1.5 rounded-xl text-xs font-bold transition-all">Desserts</button>
                </div>

                <!-- Recipe Cards List -->
                <div class="space-y-4">
                    <template x-for="r in filteredRecipes" :key="r.id">
                        <div class="bg-white dark:bg-[#1C1C1E] p-5 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm transition-all duration-200 hover:scale-[1.015] hover:border-blue-500/50 flex justify-between items-center group">
                            <div @click="openRecipeModal(r)" class="flex-1 cursor-pointer">
                                <div class="flex items-center space-x-2 mb-1">
                                    <h3 class="font-bold text-lg group-hover:text-blue-500 transition-colors" x-text="r.title"></h3>
                                    <span class="text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-md tracking-wider" 
                                          :class="{
                                              'bg-emerald-100 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400': r.category === 'meal',
                                              'bg-amber-100 text-amber-600 dark:bg-amber-950/60 dark:text-amber-400': r.category === 'baking',
                                              'bg-pink-100 text-pink-600 dark:bg-pink-950/60 dark:text-pink-400': r.category === 'dessert'
                                          }" x-text="r.category || 'meal'"></span>
                                </div>
                                <span class="text-sm text-gray-500 dark:text-gray-400 font-medium" x-text="`Prep: ${r.prep_time_min}m • Cook: ${r.cook_time_min}m • Base Servings: ${r.servings}`"></span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button @click.stop="deleteRecipe(r.id)" class="text-red-500 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-950/40 p-2 rounded-xl transition-all" title="Delete Recipe">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 2: MEAL PLANNER -->
            <div x-show="tab === 'planner'" class="space-y-6" x-cloak>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold tracking-tight">Meal Planning Calendar</h2>
                    <div class="flex items-center space-x-4">
                        <button @click="changeMonth(-1)" class="p-2 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all font-bold">←</button>
                        <span class="text-xl font-bold" x-text="`${currentMonthName} ${currentYear}`"></span>
                        <button @click="changeMonth(1)" class="p-2 rounded-xl border border-gray-200 dark:border-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800 transition-all font-bold">→</button>
                    </div>
                </div>

                <div class="bg-white dark:bg-[#1C1C1E] rounded-2xl border border-gray-200 dark:border-gray-800 p-6 shadow-sm">
                    <!-- Day Headers -->
                    <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-bold text-gray-400 uppercase tracking-wider">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <!-- Calendar Grid -->
                    <div class="grid grid-cols-7 gap-2">
                        <template x-for="blank in calendarBlanks">
                            <div class="h-32 rounded-xl bg-gray-50/50 dark:bg-gray-900/20 border border-transparent"></div>
                        </template>
                        <template x-for="day in daysInMonth" :key="day">
                            <div @click="openDayDetailModal(day)" 
                                 class="h-32 rounded-xl border border-gray-200/80 dark:border-gray-800/80 p-2 flex flex-col justify-between cursor-pointer hover:border-blue-500 transition-all bg-white dark:bg-[#1C1C1E] hover:shadow-md relative group/cell">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-sm" x-text="day"></span>
                                    <template x-if="getTotalServingsForDay(day) > 0">
                                        <span class="text-[10px] bg-blue-100 dark:bg-blue-900/60 text-blue-600 dark:text-blue-300 px-1.5 py-0.5 rounded-md font-bold" 
                                              x-text="`${getTotalServingsForDay(day)} serv`"></span>
                                    </template>
                                </div>

                                <div class="space-y-1 overflow-y-auto max-h-22">
                                    <!-- Strict First-Day-Only Defrost Alerts -->
                                    <template x-for="(defrost, idx) in getDefrostRemindersForDay(day)" :key="'def_'+idx">
                                        <div class="text-[10px] leading-tight bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-300 p-1 rounded-md font-bold flex justify-between items-center group/def">
                                            <span class="truncate" x-text="`🧊 Defrost: ${defrost.item}`"></span>
                                            <button @click.stop="removeDefrostFromDay(day, idx)" class="hidden group-hover/def:block text-red-500 font-bold ml-1">✕</button>
                                        </div>
                                    </template>
                                    <!-- Scheduled Meals -->
                                    <template x-for="(meal, idx) in getMealsForDay(day)" :key="'m_'+idx">
                                        <div class="text-[11px] leading-tight bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-300 p-1 rounded-md font-medium flex justify-between items-start group/m">
                                            <div class="truncate pr-1">
                                                <span class="font-bold block truncate" x-text="meal.title"></span>
                                                <span class="text-[9px] text-gray-400 dark:text-gray-400" x-text="`${meal.servings} servings`"></span>
                                            </div>
                                            <button @click.stop="removeMealFromDay(day, idx)" class="hidden group-hover/m:block text-red-500 font-bold ml-1">✕</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- TAB 3: SHOPPING CART -->
            <div x-show="tab === 'cart'" class="space-y-6" x-cloak>
                <h2 class="text-3xl font-bold tracking-tight mb-6">Shopping Cart</h2>
                <template x-if="Object.keys(cart).length === 0">
                    <p class="text-gray-500 dark:text-gray-400">Your shopping cart is empty. Click ingredients inside recipes to add them here.</p>
                </template>
                <div class="space-y-3">
                    <template x-for="(data, key) in cart" :key="key">
                        <div class="bg-white dark:bg-[#1C1C1E] p-4 rounded-2xl border border-gray-200 dark:border-gray-800 flex justify-between items-center shadow-sm">
                            <span class="font-bold w-1/3" x-text="data.item"></span>
                            <div class="flex items-center space-x-3">
                                <input type="number" x-model.number="data.amount" @change="saveCart(); if(data.amount <= 0) { delete cart[key]; saveCart(); }" class="w-20 p-2 rounded-xl border border-gray-300 dark:border-gray-700 text-center bg-transparent font-semibold">
                                <span class="text-sm text-gray-500 w-16" x-text="data.unit"></span>
                            </div>
                            <button @click="delete cart[key]; saveCart();" class="text-red-500 hover:text-red-700 font-semibold px-3 py-1 transition-colors">Remove</button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 4: UNIT CONVERTER -->
            <div x-show="tab === 'converter'" class="space-y-6" x-cloak>
                <h2 class="text-3xl font-bold tracking-tight mb-6">Unit Converter & Densities</h2>
                <div class="bg-white dark:bg-[#1C1C1E] p-8 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm space-y-5">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Ingredient Type (Density)</label>
                        <select x-model.number="converter.density" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-medium">
                            <option value="1.0">Water / Milk / Liquids (1.0 g/ml)</option>
                            <option value="0.53">All-Purpose Flour (0.53 g/ml)</option>
                            <option value="0.85">Granulated Sugar (0.85 g/ml)</option>
                            <option value="0.91">Butter (0.91 g/ml)</option>
                            <option value="1.42">Honey / Syrup (1.42 g/ml)</option>
                            <option value="0.38">Rolled Oats (0.38 g/ml)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Value</label>
                        <input type="number" x-model.number="converter.val" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent font-medium" placeholder="1">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2">From</label>
                            <select x-model="converter.from" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-medium">
                                <option value="tsp">tsp (teaspoon)</option>
                                <option value="tbsp">tbsp (tablespoon)</option>
                                <option value="cup">cup (c)</option>
                                <option value="fl_oz">fl oz (fluid ounce)</option>
                                <option value="pt">pt (pint)</option>
                                <option value="qt">qt (quart)</option>
                                <option value="gal">gal (gallon)</option>
                                <option value="ml">ml / cc</option>
                                <option value="l">liter (L)</option>
                                <option value="g">g (gram)</option>
                                <option value="oz">oz (dry ounce)</option>
                                <option value="lb">lb (pound)</option>
                                <option value="kg">kg (kilogram)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-2">To</label>
                            <select x-model="converter.to" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-medium">
                                <option value="tbsp">tbsp (tablespoon)</option>
                                <option value="tsp">tsp (teaspoon)</option>
                                <option value="cup">cup (c)</option>
                                <option value="fl_oz">fl oz (fluid ounce)</option>
                                <option value="pt">pt (pint)</option>
                                <option value="qt">qt (quart)</option>
                                <option value="gal">gal (gallon)</option>
                                <option value="ml">ml / cc</option>
                                <option value="l">liter (L)</option>
                                <option value="g">g (gram)</option>
                                <option value="oz">oz (dry ounce)</option>
                                <option value="lb">lb (pound)</option>
                                <option value="kg">kg (kilogram)</option>
                            </select>
                        </div>
                    </div>
                    <button @click="convertUnits()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3.5 rounded-xl transition-all shadow-md active:scale-95">Calculate Conversion</button>
                    <div class="text-lg font-bold mt-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/40 border border-gray-200 dark:border-gray-800" x-text="converter.result"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Recipe Card Overlay -->
    <div x-show="activeRecipe" 
         class="fixed inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center p-6 z-50 transition-all duration-300" x-cloak>
        
        <div @click.away="activeRecipe = null"
             class="bg-white dark:bg-[#1C1C1E] w-full max-w-2xl max-h-[90vh] rounded-3xl shadow-2xl overflow-y-auto p-8 relative border border-gray-200 dark:border-gray-800">
            
            <button @click="activeRecipe = null" class="absolute top-6 right-6 text-gray-400 hover:text-gray-600 dark:hover:text-white text-xl font-bold">✕</button>
            
            <template x-if="activeRecipe">
                <div>
                    <!-- Action Bar with Print/PDF Button -->
                    <div class="flex justify-between items-start mb-4 pr-10">
                        <div>
                            <h2 class="text-2xl font-bold" x-text="activeRecipe.title"></h2>
                            <span class="text-xs uppercase font-extrabold px-2.5 py-0.5 rounded-md tracking-wider mt-1 inline-block" 
                                  :class="{
                                      'bg-emerald-100 text-emerald-600 dark:bg-emerald-950/60 dark:text-emerald-400': activeRecipe.category === 'meal',
                                      'bg-amber-100 text-amber-600 dark:bg-amber-950/60 dark:text-amber-400': activeRecipe.category === 'baking',
                                      'bg-pink-100 text-pink-600 dark:bg-pink-950/60 dark:text-pink-400': activeRecipe.category === 'dessert'
                                  }" x-text="activeRecipe.category || 'meal'"></span>
                        </div>
                        <button @click="downloadPDF()" class="bg-gray-100 dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-blue-950/40 text-blue-600 dark:text-blue-400 px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center space-x-1 border border-gray-200 dark:border-gray-700">
                            <span>📄 Print / Export PDF</span>
                        </button>
                    </div>

                    <!-- Interactive Recipe View -->
                    <div class="space-y-6">
                        <div class="bg-blue-50 dark:bg-blue-950/30 p-4 rounded-2xl border border-blue-200/50 dark:border-blue-900/50 flex justify-between items-center">
                            <div>
                                <span class="font-bold text-sm block">Adjust Servings</span>
                                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="`Base Recipe: ${activeRecipe.servings} servings`"></span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button @click="if(currentServings > 1) currentServings--" class="w-8 h-8 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 font-bold flex items-center justify-center">-</button>
                                <input type="number" x-model.number="currentServings" class="w-14 text-center font-bold bg-transparent border-b border-blue-500 py-1" min="1">
                                <button @click="currentServings++" class="w-8 h-8 rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 font-bold flex items-center justify-center">+</button>
                            </div>
                        </div>

                        <h3 class="font-bold text-sm uppercase tracking-wider text-gray-400 mb-3">Ingredients (Scaled for <span x-text="currentServings"></span> servings):</h3>
                        <div class="space-y-2 mb-8">
                            <template x-for="i in activeRecipe.ingredients">
                                <div @click="openCartPrompt(i)" class="p-3.5 bg-gray-50 dark:bg-gray-800/40 rounded-2xl cursor-pointer hover:bg-blue-50 dark:hover:bg-blue-950/30 transition-colors border border-gray-200/50 dark:border-gray-800/50 flex justify-between items-center group">
                                    <span class="font-medium text-gray-900 dark:text-gray-100" x-text="`• ${i.item}`"></span>
                                    <span class="text-sm text-gray-500 group-hover:text-blue-500 transition-colors font-medium" 
                                          x-text="`${(i.amount_us * servingMultiplier).toFixed(2).replace(/\.00$/, '')} ${i.unit_us} / ${(i.amount_metric * servingMultiplier).toFixed(2).replace(/\.00$/, '')} ${i.unit_metric}`"></span>
                                </div>
                            </template>
                        </div>

                        <h3 class="font-bold text-sm uppercase tracking-wider text-gray-400 mb-3">Instructions:</h3>
                        <ol class="space-y-3">
                            <template x-for="(step, idx) in activeRecipe.instructions">
                                <li class="flex items-start space-x-3 text-sm leading-relaxed text-gray-700 dark:text-gray-300">
                                    <span class="font-bold text-blue-500 mt-0.5" x-text="idx + 1 + '.'"></span>
                                    <span x-text="step" class="text-gray-900 dark:text-gray-100"></span>
                                </li>
                            </template>
                        </ol>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Hidden Dedicated Pure-Text White Background Print Layout -->
    <div id="print-area" class="hidden">
        <template x-if="activeRecipe">
            <div>
                <h1 style="font-size: 24pt; font-weight: bold; margin-bottom: 8px;" x-text="activeRecipe.title"></h1>
                <p style="font-size: 11pt; color: #555; margin-bottom: 24px;" x-text="`Category: ${(activeRecipe.category || 'meal').toUpperCase()} | Prep: ${activeRecipe.prep_time_min} mins | Cook: ${activeRecipe.cook_time_min} mins | Yield: ${currentServings} servings`"></p>

                <hr style="border: 0; border-top: 1px solid #ccc; margin-bottom: 20px;">

                <h2 style="font-size: 14pt; font-weight: bold; text-transform: uppercase; margin-bottom: 12px;">Ingredients:</h2>
                <ul style="list-style-type: none; padding-left: 0; margin-bottom: 24px;">
                    <template x-for="i in activeRecipe.ingredients">
                        <li style="font-size: 11pt; padding: 6px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;">
                            <span style="font-weight: 600;" x-text="`• ${i.item}`"></span>
                            <span x-text="`${(i.amount_us * servingMultiplier).toFixed(2).replace(/\.00$/, '')} ${i.unit_us} (${(i.amount_metric * servingMultiplier).toFixed(2).replace(/\.00$/, '')} ${i.unit_metric})`"></span>
                        </li>
                    </template>
                </ul>

                <h2 style="font-size: 14pt; font-weight: bold; text-transform: uppercase; margin-bottom: 12px;">Instructions:</h2>
                <ol style="padding-left: 20px; font-size: 11pt; line-height: 1.6;">
                    <template x-for="(step, idx) in activeRecipe.instructions">
                        <li style="margin-bottom: 10px;" x-text="step"></li>
                    </template>
                </ol>
            </div>
        </template>
    </div>

    <!-- Modal Day Detail View -->
    <div x-show="dayDetailModal.open" class="fixed inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center p-6 z-50" x-cloak>
        <div @click.away="dayDetailModal.open = false" class="bg-white dark:bg-[#1C1C1E] w-full max-w-lg rounded-3xl shadow-2xl p-6 border border-gray-200 dark:border-gray-800 space-y-6">
            <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-800 pb-4">
                <div>
                    <h3 class="text-xl font-bold" x-text="`${currentMonthName} ${dayDetailModal.day}, ${currentYear}`"></h3>
                    <span class="text-xs text-blue-500 font-bold" x-text="`Total Planned Servings: ${getTotalServingsForDay(dayDetailModal.day)}`"></span>
                </div>
                <button @click="dayDetailModal.open = false" class="text-gray-400 hover:text-white font-bold text-lg">✕</button>
            </div>

            <!-- Defrost Reminders for this Day -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-amber-500">🧊 Defrost Alerts (Prepare Today)</h4>
                <template x-if="getDefrostRemindersForDay(dayDetailModal.day).length === 0">
                    <p class="text-xs text-gray-400 italic">No defrost reminders for today.</p>
                </template>
                <div class="space-y-1.5">
                    <template x-for="(defrost, idx) in getDefrostRemindersForDay(dayDetailModal.day)" :key="'mod_def_'+idx">
                        <div class="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-xl border border-amber-200/50 dark:border-amber-900/50 flex justify-between items-center text-sm">
                            <div>
                                <span class="font-bold text-amber-600 dark:text-amber-300 block" x-text="defrost.item"></span>
                                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="`Needed for: ${defrost.forMeal}`"></span>
                            </div>
                            <button @click="removeDefrostFromDay(dayDetailModal.day, idx)" class="text-red-500 font-bold hover:bg-red-100 dark:hover:bg-red-950/60 px-2 py-1 rounded-lg text-xs">Delete Alert</button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Scheduled Meals for this Day -->
            <div class="space-y-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-blue-500">🍳 Scheduled Meals</h4>
                <template x-if="getMealsForDay(dayDetailModal.day).length === 0">
                    <p class="text-xs text-gray-400 italic">No meals scheduled for this day.</p>
                </template>
                <div class="space-y-2">
                    <template x-for="(meal, idx) in getMealsForDay(dayDetailModal.day)" :key="'mod_m_'+idx">
                        <div class="p-3 bg-gray-50 dark:bg-gray-800/40 rounded-xl border border-gray-200/60 dark:border-gray-800/60 flex justify-between items-center">
                            <div>
                                <span class="font-bold text-sm block" x-text="meal.title"></span>
                                <span class="text-xs text-gray-500 dark:text-gray-400" x-text="`${meal.servings} servings`"></span>
                            </div>
                            <button @click="removeMealFromDay(dayDetailModal.day, idx)" class="text-red-500 font-bold hover:bg-red-100 dark:hover:bg-red-950/60 px-2 py-1 rounded-lg text-xs">Remove Meal</button>
                        </div>
                    </template>
                </div>
            </div>

            <div class="flex space-x-3 pt-2">
                <button @click="openMealPlannerModal(dayDetailModal.day); dayDetailModal.open = false;" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold shadow-md">+ Add New Meal</button>
            </div>
        </div>
    </div>

    <!-- Multi-Day Meal Planner Setup Dialog -->
    <div x-show="mealPlannerModal.open" class="fixed inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center p-6 z-50" x-cloak>
        <div class="bg-white dark:bg-[#1C1C1E] w-full max-w-xl max-h-[85vh] rounded-3xl shadow-2xl p-6 border border-gray-200 dark:border-gray-800 flex flex-col justify-between">
            <div class="overflow-y-auto space-y-4 pr-1">
                <h3 class="text-lg font-bold" x-text="`Plan Meal Starting ${currentMonthName} ${mealPlannerModal.day}`"></h3>
                
                <div>
                    <label class="block text-sm font-semibold mb-1">Select Recipe or Custom Title</label>
                    <select x-model="mealPlannerModal.selectedRecipe" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-medium mb-2">
                        <option value="">-- Choose Recipe --</option>
                        <template x-for="r in recipes" :key="r.id">
                            <option :value="r.title" x-text="r.title"></option>
                        </template>
                    </select>
                    <input type="text" x-model="mealPlannerModal.customMeal" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent font-medium" placeholder="Or type custom meal title">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">🧊 Defrost Alert (Reminds ONLY day before first meal)</label>
                    <input type="text" x-model="mealPlannerModal.defrostItem" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent font-medium text-sm" placeholder="e.g. Ground Beef">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Target End Date</label>
                    <input type="date" x-model="mealPlannerModal.endDate" @change="buildDateRangeConfig()" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-medium">
                </div>

                <!-- Per-Date Interactive Servings Checkboxes -->
                <div>
                    <label class="block text-sm font-semibold mb-2">Configure Servings per Day</label>
                    <div class="space-y-2 border border-gray-200 dark:border-gray-800 rounded-2xl p-3 bg-gray-50/50 dark:bg-gray-900/30 max-h-52 overflow-y-auto">
                        <template x-for="(config, idx) in mealPlannerModal.dateConfigs" :key="config.dateStr">
                            <div class="flex items-center justify-between p-2.5 rounded-xl border border-gray-200/60 dark:border-gray-800/60 bg-white dark:bg-[#1C1C1E]">
                                <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer">
                                    <input type="checkbox" x-model="config.enabled" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
                                    <span x-text="config.displayDate"></span>
                                </label>
                                <div class="flex items-center space-x-1">
                                    <span class="text-[11px] text-gray-400">Servings:</span>
                                    <input type="number" x-model.number="config.servings" min="1" class="w-14 text-center text-xs font-bold p-1 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent">
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div class="flex space-x-3 pt-4">
                <button @click="mealPlannerModal.open = false" class="flex-1 bg-gray-100 dark:bg-gray-800 py-3 rounded-xl font-semibold">Cancel</button>
                <button @click="addMealToDay()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold shadow-md">Add to Calendar</button>
            </div>
        </div>
    </div>

    <!-- Add to Cart Quantity / Unit Prompt Modal -->
    <div x-show="cartPrompt.open" class="fixed inset-0 bg-black/40 backdrop-blur-md flex items-center justify-center p-6 z-50" x-cloak>
        <div class="bg-white dark:bg-[#1C1C1E] w-full max-w-sm rounded-3xl shadow-2xl p-6 border border-gray-200 dark:border-gray-800 space-y-4">
            <h3 class="text-lg font-bold" x-text="`Add: ${cartPrompt.item?.item}`"></h3>
            <div>
                <label class="block text-sm font-semibold mb-1">Quantity</label>
                <input type="number" x-model.number="cartPrompt.qty" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-transparent font-semibold">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">Unit</label>
                <select x-model="cartPrompt.unit" class="w-full p-3 rounded-xl border border-gray-300 dark:border-gray-700 bg-white dark:bg-[#121212] text-gray-900 dark:text-gray-100 font-semibold">
                    <option value="g">g</option><option value="kg">kg</option><option value="lb">lb</option><option value="oz">oz</option><option value="ml">ml</option><option value="cup">cup</option><option value="tbsp">tbsp</option><option value="tsp">tsp</option><option value="piece">piece</option>
                </select>
            </div>
            <div class="flex space-x-3 pt-2">
                <button @click="cartPrompt.open = false" class="flex-1 bg-gray-100 dark:bg-gray-800 py-3 rounded-xl font-semibold">Cancel</button>
                <button @click="confirmAddToCart()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold shadow-md">Add</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_RECIPES = [
            {
                id: "pancakes",
                title: "Quick Fluffy Pancakes",
                category: "baking",
                prep_time_min: 10,
                cook_time_min: 10,
                servings: 2,
                ingredients: [
                    { item: "All-Purpose Flour", amount_us: 1, unit_us: "cup", amount_metric: 120, unit_metric: "g" },
                    { item: "Milk", amount_us: 1, unit_us: "cup", amount_metric: 240, unit_metric: "ml" },
                    { item: "Egg", amount_us: 1, unit_us: "large", amount_metric: 1, unit_metric: "large" },
                    { item: "Butter (melted)", amount_us: 2, unit_us: "tbsp", amount_metric: 30, unit_metric: "g" }
                ],
                instructions: [
                    "Whisk flour, egg, milk, and melted butter in a bowl until just combined.",
                    "Heat a lightly oiled griddle over medium-high heat.",
                    "Pour batter onto griddle and cook until bubbles form, then flip and brown."
                ]
            },
            {
                id: "chili",
                title: "Classic Beef Chili",
                category: "meal",
                prep_time_min: 15,
                cook_time_min: 45,
                servings: 4,
                ingredients: [
                    { item: "Ground Beef", amount_us: 1.0, unit_us: "lb", amount_metric: 450.0, unit_metric: "g" },
                    { item: "Kidney Beans", amount_us: 1.0, unit_us: "can", amount_metric: 400.0, unit_metric: "g" },
                    { item: "Diced Tomatoes", amount_us: 14.5, unit_us: "oz", amount_metric: 410.0, unit_metric: "g" },
                    { item: "Chili Powder", amount_us: 2.0, unit_us: "tbsp", amount_metric: 30.0, unit_metric: "ml" }
                ],
                instructions: [
                    "Brown ground beef in a large pot over medium-high heat until cooked through.",
                    "Drain excess fat, then add diced tomatoes and kidney beans.",
                    "Stir in chili powder, reduce heat to low, and simmer uncovered for 30 minutes.",
                    "Serve hot with optional cheese or sour cream."
                ]
            }
        ];

        function recipeApp() {
            return {
                darkMode: true,
                tab: 'recipes',
                recipes: [],
                cart: {},
                mealPlan: {}, // "YYYY-MM-DD": [{ title, servings }]
                defrostReminders: {}, // "YYYY-MM-DD": [{ item, forMeal }]
                activeRecipe: null,
                currentServings: 2,
                cartPrompt: { open: false, item: null, qty: 1, unit: 'g' },
                converter: { val: 1, density: 0.53, from: 'cup', to: 'g', result: 'Result: —' },
                
                // Sorting & Filter State
                sortBy: 'default',
                filterCategory: 'all',

                // Meal Planner State
                currentDate: new Date(),
                dayDetailModal: { open: false, day: 1 },
                mealPlannerModal: { open: false, day: 1, selectedRecipe: '', customMeal: '', defrostItem: '', endDate: '', dateConfigs: [] },

                initApp() {
                    const savedDark = localStorage.getItem('recipes_darkMode');
                    this.darkMode = savedDark !== null ? JSON.parse(savedDark) : true;
                    if(this.darkMode) document.documentElement.classList.add('dark');

                    const savedRecipes = localStorage.getItem('recipes_data');
                    if (savedRecipes) {
                        try { this.recipes = JSON.parse(savedRecipes); } catch(e) { this.recipes = DEFAULT_RECIPES; }
                    } else {
                        this.recipes = DEFAULT_RECIPES;
                        this.saveRecipes();
                    }

                    const savedCart = localStorage.getItem('recipes_cart');
                    if (savedCart) {
                        try { this.cart = JSON.parse(savedCart); } catch(e) { this.cart = {}; }
                    }

                    const savedPlan = localStorage.getItem('recipes_meal_plan');
                    if (savedPlan) {
                        try { this.mealPlan = JSON.parse(savedPlan); } catch(e) { this.mealPlan = {}; }
                    }

                    const savedDefrost = localStorage.getItem('recipes_defrost_reminders');
                    if (savedDefrost) {
                        try { this.defrostReminders = JSON.parse(savedDefrost); } catch(e) { this.defrostReminders = {}; }
                    }
                },

                get filteredRecipes() {
                    let list = [...this.recipes];
                    if (this.filterCategory !== 'all') {
                        list = list.filter(r => (r.category || 'meal') === this.filterCategory);
                    }
                    if (this.sortBy === 'alpha') {
                        list.sort((a, b) => a.title.localeCompare(b.title));
                    }
                    return list;
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('recipes_darkMode', JSON.stringify(this.darkMode));
                    if(this.darkMode) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },

                saveRecipes() { localStorage.setItem('recipes_data', JSON.stringify(this.recipes)); },
                saveCart() { localStorage.setItem('recipes_cart', JSON.stringify(this.cart)); },
                saveMealPlan() { 
                    localStorage.setItem('recipes_meal_plan', JSON.stringify(this.mealPlan)); 
                    localStorage.setItem('recipes_defrost_reminders', JSON.stringify(this.defrostReminders));
                },

                get servingMultiplier() {
                    if (!this.activeRecipe || !this.currentServings) return 1;
                    return this.currentServings / this.activeRecipe.servings;
                },

                openRecipeModal(r) {
                    this.activeRecipe = r;
                    this.currentServings = r.servings;
                },

                downloadPDF() {
                    if (!this.activeRecipe) return;
                    window.print();
                },

                deleteRecipe(id) {
                    if (confirm("Are you sure you want to permanently delete this recipe?")) {
                        this.recipes = this.recipes.filter(r => r.id !== id);
                        this.saveRecipes();
                        if (this.activeRecipe && this.activeRecipe.id === id) {
                            this.activeRecipe = null;
                        }
                    }
                },

                openCartPrompt(ing) {
                    const scaledUS = ing.amount_us * this.servingMultiplier;
                    this.cartPrompt = {
                        open: true,
                        item: ing,
                        qty: parseFloat(scaledUS.toFixed(2)),
                        unit: ing.unit_us || 'g'
                    };
                },

                confirmAddToCart() {
                    const { item, qty, unit } = this.cartPrompt;
                    const key = `${item.item} (${unit})`;
                    if (this.cart[key]) {
                        this.cart[key].amount += qty;
                    } else {
                        this.cart[key] = { item: item.item, amount: qty, unit: unit };
                    }
                    this.saveCart();
                    this.cartPrompt.open = false;
                },

                // Calendar Methods
                get currentYear() { return this.currentDate.getFullYear(); },
                get currentMonth() { return this.currentDate.getMonth(); },
                get currentMonthName() {
                    return this.currentDate.toLocaleString('default', { month: 'long' });
                },
                get daysInMonth() {
                    return new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                },
                get calendarBlanks() {
                    const firstDay = new Date(this.currentYear, this.currentMonth, 1).getDay();
                    return Array.from({ length: firstDay });
                },
                changeMonth(delta) {
                    this.currentDate = new Date(this.currentYear, this.currentMonth + delta, 1);
                },
                getDateKey(year, month, day) {
                    const m = String(month + 1).padStart(2, '0');
                    const d = String(day).padStart(2, '0');
                    return `${year}-${m}-${d}`;
                },
                getMealsForDay(day) {
                    const key = this.getDateKey(this.currentYear, this.currentMonth, day);
                    return this.mealPlan[key] || [];
                },
                getDefrostRemindersForDay(day) {
                    const key = this.getDateKey(this.currentYear, this.currentMonth, day);
                    return this.defrostReminders[key] || [];
                },
                getTotalServingsForDay(day) {
                    const meals = this.getMealsForDay(day);
                    return meals.reduce((sum, m) => sum + (parseInt(m.servings) || 0), 0);
                },

                openDayDetailModal(day) {
                    this.dayDetailModal = { open: true, day: day };
                },

                openMealPlannerModal(day) {
                    const startStr = this.getDateKey(this.currentYear, this.currentMonth, day);
                    this.mealPlannerModal = { 
                        open: true, 
                        day: day, 
                        selectedRecipe: '', 
                        customMeal: '', 
                        defrostItem: '',
                        endDate: startStr,
                        dateConfigs: []
                    };
                    this.buildDateRangeConfig();
                },

                buildDateRangeConfig() {
                    const startDate = new Date(this.currentYear, this.currentMonth, this.mealPlannerModal.day);
                    let endDate = new Date(startDate);

                    if (this.mealPlannerModal.endDate) {
                        const parts = this.mealPlannerModal.endDate.split('-');
                        endDate = new Date(parts[0], parts[1] - 1, parts[2]);
                    }

                    if (endDate < startDate) endDate = new Date(startDate);

                    const configs = [];
                    let cur = new Date(startDate);
                    while (cur <= endDate) {
                        const dateStr = this.getDateKey(cur.getFullYear(), cur.getMonth(), cur.getDate());
                        const displayDate = cur.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                        configs.push({
                            dateObj: new Date(cur),
                            dateStr: dateStr,
                            displayDate: displayDate,
                            enabled: true,
                            servings: 2
                        });
                        cur.setDate(cur.getDate() + 1);
                    }
                    this.mealPlannerModal.dateConfigs = configs;
                },

                addMealToDay() {
                    const title = this.mealPlannerModal.selectedRecipe || this.mealPlannerModal.customMeal;
                    if (!title) return;

                    let firstEnabledDateObj = null;

                    this.mealPlannerModal.dateConfigs.forEach(config => {
                        if (config.enabled) {
                            const key = config.dateStr;
                            if (!this.mealPlan[key]) this.mealPlan[key] = [];

                            this.mealPlan[key].push({ title: title, servings: config.servings });

                            if (!firstEnabledDateObj) {
                                firstEnabledDateObj = config.dateObj;
                            }
                        }
                    });

                    // Strict First-Day-Only Defrost Logic
                    if (this.mealPlannerModal.defrostItem && firstEnabledDateObj) {
                        const prevDate = new Date(firstEnabledDateObj);
                        prevDate.setDate(prevDate.getDate() - 1);
                        const prevKey = this.getDateKey(prevDate.getFullYear(), prevDate.getMonth(), prevDate.getDate());
                        
                        if (!this.defrostReminders[prevKey]) this.defrostReminders[prevKey] = [];
                        this.defrostReminders[prevKey].push({
                            item: this.mealPlannerModal.defrostItem,
                            forMeal: title
                        });
                    }

                    this.saveMealPlan();
                    this.mealPlannerModal.open = false;
                },

                removeMealFromDay(day, idx) {
                    const key = this.getDateKey(this.currentYear, this.currentMonth, day);
                    if (this.mealPlan[key]) {
                        this.mealPlan[key].splice(idx, 1);
                        this.saveMealPlan();
                    }
                },

                removeDefrostFromDay(day, idx) {
                    const key = this.getDateKey(this.currentYear, this.currentMonth, day);
                    if (this.defrostReminders[key]) {
                        this.defrostReminders[key].splice(idx, 1);
                        this.saveMealPlan();
                    }
                },

                // Precision Conversion Matrix & Fractional Culinary Logic
                convertUnits() {
                    const val = parseFloat(this.converter.val) || 0;
                    const density = parseFloat(this.converter.density);
                    const uFrom = this.converter.from;
                    const uTo = this.converter.to;

                    const volToTsp = {
                        tsp: 1,
                        tbsp: 3,
                        cup: 48,
                        fl_oz: 6,
                        pt: 96,
                        qt: 192,
                        gal: 768,
                        ml: 1 / 4.92892,
                        l: 1000 / 4.92892
                    };

                    const massToGrams = {
                        g: 1,
                        oz: 28.35,
                        lb: 453.6,
                        kg: 1000
                    };

                    let baseGrams = 0;

                    if (massToGrams[uFrom]) {
                        baseGrams = val * massToGrams[uFrom];
                    } else if (volToTsp[uFrom]) {
                        const totalTsp = val * volToTsp[uFrom];
                        const totalMl = totalTsp * 4.92892;
                        baseGrams = totalMl * density;
                    }

                    let finalVal = 0;
                    if (massToGrams[uTo]) {
                        finalVal = baseGrams / massToGrams[uTo];
                    } else if (volToTsp[uTo]) {
                        const totalMl = baseGrams / density;
                        const totalTsp = totalMl / 4.92892;
                        finalVal = totalTsp / volToTsp[uTo];
                    }

                    let extraBreakdown = "";
                    if (uTo === 'cup' || uTo === 'tbsp') {
                        const totalTsp = (baseGrams / density) / 4.92892;
                        const cups = Math.floor(totalTsp / 48);
                        let remTsp = Math.round(totalTsp % 48);
                        const tbsp = Math.floor(remTsp / 3);
                        remTsp = remTsp % 3;

                        const parts = [];
                        if (cups > 0) parts.push(`${cups} cup${cups > 1 ? 's' : ''}`);
                        if (tbsp > 0) parts.push(`${tbsp} tbsp`);
                        if (remTsp > 0) parts.push(`${remTsp} tsp`);

                        if (parts.length > 0) {
                            extraBreakdown = ` (${parts.join(' + ')})`;
                        }
                    }

                    this.converter.result = `Result: ${val} ${uFrom} = ${finalVal.toFixed(2)} ${uTo}${extraBreakdown}`;
                },

                importRecipe(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            let data;
                            if (file.name.endsWith('.yaml') || file.name.endsWith('.yml')) {
                                data = jsyaml.load(e.target.result);
                            } else {
                                data = JSON.parse(e.target.result);
                            }
                            if (!data.id) data.id = 'rec_' + Date.now();
                            if (!data.category) data.category = 'meal';
                            this.recipes.push(data);
                            this.saveRecipes();
                            alert(`Successfully imported '${data.title}'!`);
                        } catch (err) {
                            alert('Failed to parse file. Ensure it is valid YAML or JSON.');
                        }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
