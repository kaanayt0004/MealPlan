instructions:
  - "In a large pot, bring a gallon of water and 2 tablespoons salt to a boil over high heat. Add potatoes and boil for 15 to 20 minutes, until soft."
  - "Heat 6 tablespoons of butter and milk together until melted. Drain potatoes well and mash hot potatoes until smooth. Mix in the hot butter mixture, stir in Cheddar, and season to taste with salt and pepper. Cover and set aside."
  - "Preheat oven to 375°F. Melt remaining 2 tablespoons butter in a large oven-safe skillet or braiser over medium heat. Add onion, carrot, garlic, thyme, and rosemary; cook for 10 minutes until onions are translucent."
  - "Add ground beef and lamb, cooking and breaking up meat until no longer pink. Drain excess fat if desired, and season with salt and pepper."
  - "Stir in tomato paste and cook for 2 to 3 minutes. Sprinkle flour over the mixture and cook for 1 minute."
  - "Add beef stock and cook until liquid thickens slightly. Stir in chopped parsley and remove thyme and rosemary stems."
  - "Top meat mixture with dollops of mashed potatoes and spread evenly. (Optionally transfer meat mixture to a 3-quart casserole dish before adding potatoes)."
  - "Bake pie for 30 minutes until potatoes begin to brown and edges are bubbling. Let stand 15 minutes before serving."